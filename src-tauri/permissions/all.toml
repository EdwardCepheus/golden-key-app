[[permission]]
identifier = "allow-all-commands"
description = "Enables all custom commands in this application"
commands.allow = [
  "get_all_products",
  "get_product",
  "create_product",
  "update_product",
  "delete_product",
  "ai_generate_title",
  "ai_suggest_price",
  "ai_generate_description",
  "test_ai_connection"
]
