    <circle cx="22" cy="28" r="8" fill="#0F1117"/>
    <!-- Key shaft -->
    <rect x="35" y="24" width="35" height="8" rx="2" fill="url(#gold)"/>
    <!-- Key teeth -->
    <rect x="55" y="32" width="5" height="8" rx="1" fill="url(#gold)"/>
    <rect x="63" y="32" width="5" height="12" rx="1" fill="url(#gold)"/>
    <rect x="50" y="32" width="4" height="6" rx="1" fill="url(#gold)"/>
  </g>
</svg>
